<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gramzo</title>
  <style>
    *{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f8fafc;color:#111827}
    .hero{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;padding:24px 0 32px}
    .wrap{max-width:980px;margin:auto;padding:16px}
    .brand{display:flex;align-items:center;gap:14px}.brand img{height:72px;border-radius:16px}
    .lang{margin-left:auto;padding:10px;border:none;border-radius:12px}
    .services{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
    .card,.section{background:#fff;border-radius:24px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
    .card{text-align:center}.card img{height:56px;width:56px;border-radius:18px}
    .section{margin-top:18px}
    input,select,button{width:100%;padding:14px;border-radius:14px;border:1px solid #d1d5db;margin-top:10px}
    button{background:#16a34a;color:#fff;border:none;font-weight:700;cursor:pointer}
    .productRow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
    .smallBtn{width:auto;margin:0;padding:8px 12px}
  </style>
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <div class="brand">
        <img src="logo.png" alt="Gramzo" />
        <div>
          <h1 style="margin:0">Gramzo</h1>
          <div id="tagline">Rural Living, Simplified</div>
        </div>
        <select id="lang" class="lang" onchange="changeLang()">
          <option value="en">English</option>
          <option value="bn">বাংলা</option>
          <option value="hi">हिन्दी</option>
          <option value="sat">ᱚᱞ ᱪᱤᱠᱤ</option>
        </select>
      </div>
      <div class="services">
        <div class="card"><img src="food.png" /><h3>Food</h3></div>
        <div class="card"><img src="grocery.png" /><h3>Grocery</h3></div>
        <div class="card"><img src="ride.png" /><h3>Ride</h3></div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="section">
      <h2>Login / Register</h2>
      <select id="role"><option>User</option><option>Partner</option><option>Admin</option></select>
      <input id="name" placeholder="Name" />
      <input id="phone" placeholder="Phone" />
      <input id="pin" placeholder="4 digit PIN" />
      <button onclick="registerUser()">Register</button>
      <button onclick="loginUser()">Login</button>
    </div>

    <div class="section">
      <h2>Add Product</h2>
      <input id="productName" placeholder="Product Name" />
      <input id="productPrice" placeholder="Price" />
      <button onclick="addProduct()">Add Product</button>
      <div id="products"></div>
    </div>

    <div class="section">
      <h2>🛒 Cart</h2>
      <div id="cartItems"><p>No items in cart</p></div>
      <div id="cartTotal" style="font-weight:700">Total: ₹0</div>
      <input id="deliveryAddress" placeholder="Delivery Address" />
      <select id="deliveryGp" onchange="renderCart()">
        <option>Santuri</option><option>Muradi</option><option>Garshika</option><option>Tarabari</option><option>Ramchandrapur-Kotaldi</option><option>Balitora</option>
      </select>
      <button onclick="checkoutCart()">Checkout (COD / UPI)</button>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCA4U4jva7HHeMP-yk1VJy3l_BBct3Gohg",
  authDomain: "gramzo.firebaseapp.com",
  projectId: "gramzo",
  storageBucket: "gramzo.firebasestorage.app",
  messagingSenderId: "674262956986",
  appId: "1:674262956986:web:772f68694c77e15bf3fb83",
  measurementId: "G-K5WBG7RRFM"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const t={en:'Rural Living, Simplified',bn:'গ্রামীণ জীবন, সহজভাবে',hi:'ग्रामीण जीवन, आसान',sat:'ᱨᱩᱨᱟᱞ ᱡᱤᱵᱚᱱ, ᱥᱚᱦᱚᱡ'};
const cart=[];
function changeLang(){tagline.innerText=t[lang.value];}
async function registerUser(){
  const payload = {
    role: role.value,
    name: name.value.trim(),
    phone: phone.value.trim(),
    pin: pin.value.trim(),
    createdAt: new Date().toISOString()
  };
  if(!payload.phone || !payload.pin) return alert('Phone and PIN required');
  await db.collection('users').doc(payload.phone).set(payload);
  alert('Registered successfully');
}
async function loginUser(){
  const doc = await db.collection('users').doc(phone.value.trim()).get();
  if(!doc.exists) return alert('No account found');
  if(doc.data().pin !== pin.value.trim()) return alert('Wrong PIN');
  alert('Login success');
}
async function addProduct(){
 const name=productName.value.trim(); const price=Number(productPrice.value||0); if(!name||!price)return;
 products.innerHTML=`<div class="card productRow">${name} • ₹${price}<button class="smallBtn" onclick="addToCart('${name}',${price})">Add to Cart</button></div>`+products.innerHTML;
 await db.collection('products').add({name,price,createdAt:new Date().toISOString()});
 productName.value=''; productPrice.value='';
}
function addToCart(name,price){cart.push({name,price});renderCart();}
function renderCart(){
 const charges={Santuri:10,Muradi:20,Garshika:20,Tarabari:25,'Ramchandrapur-Kotaldi':25,Balitora:25};
 const dc=charges[deliveryGp.value]||10;
 if(!cart.length){cartItems.innerHTML='<p>No items in cart</p>';cartTotal.innerText='Total: ₹0';return;}
 let total=0; cartItems.innerHTML=cart.map(i=>{total+=i.price; return `<div class="card" style="text-align:left;margin-top:8px">${i.name} • ₹${i.price}</div>`}).join('');
 total+=dc; cartTotal.innerText=`Total: ₹${total} (incl delivery ₹${dc})`;
}
async function checkoutCart(){
  if(!cart.length) return alert('Cart is empty');
  const order = {
    items: [...cart],
    gp: deliveryGp.value,
    address: deliveryAddress.value.trim(),
    total: cart.reduce((s,i)=>s+i.price,0),
    paymentMode: 'COD / UPI',
    status: 'Placed',
    createdAt: new Date().toISOString()
  };
  await db.collection('orders').add(order);
  alert(`Order placed for ${deliveryGp.value} at ${deliveryAddress.value}`);
  cart.length=0; renderCart();
}
</script>
</body>
</html>
