<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gramzo | Rural Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --primary: #10b981; /* Emerald 500 */
            --primary-dark: #047857; /* Emerald 700 */
            --bg-color: #f3f4f6; /* Gray 100 */
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 90px; /* Space for bottom nav */
        }

        /* Utilities */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.8); }
        
        /* Smooth Transitions */
        .view-section { display: none; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .view-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forms & Inputs */
        .input-field {
            @apply w-full px-5 py-4 bg-gray-50/50 rounded-2xl border border-gray-200 outline-none focus:bg-white focus:ring-2 ring-emerald-500/50 focus:border-emerald-500 transition-all text-sm font-medium;
        }

        /* Modals & Bottom Sheets */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(17, 24, 39, 0.4); backdrop-filter: blur(4px); z-index: 100; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: block; opacity: 1; }
        
        .modal-content {
            position: absolute; bottom: 0; left: 0; right: 0; background: white; border-radius: 2rem 2rem 0 0; padding: 2rem; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); max-height: 90vh; overflow-y: auto;
        }
        @media (min-width: 640px) {
            .modal-content {
                bottom: auto; top: 50%; left: 50%; right: auto; transform: translate(-50%, -40%); border-radius: 2rem; width: 100%; max-width: 28rem;
            }
            .modal-overlay.active .modal-content { transform: translate(-50%, -50%); }
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        /* Super App Icons */
        .super-icon-wrapper {
            background: linear-gradient(145deg, #ffffff, #f3f4f6);
            box-shadow: 4px 4px 10px #e5e7eb, -4px -4px 10px #ffffff;
            transition: all 0.2s ease;
        }
        .super-icon-wrapper:active {
            box-shadow: inset 4px 4px 10px #e5e7eb, inset -4px -4px 10px #ffffff;
        }

        /* Badges */
        .badge { @apply px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider; }
        .badge-User { @apply bg-blue-100 text-blue-700; }
        .badge-Partner { @apply bg-amber-100 text-amber-700; }
        .badge-Admin { @apply bg-purple-100 text-purple-700; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="glass-nav fixed top-0 w-full z-40 border-b border-gray-200/50">
        <div class="max-w-md mx-auto px-5 py-4 flex justify-between items-center sm:max-w-4xl">
            <!-- Left: Branding -->
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                    <i class="fa-solid fa-leaf text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-gray-900 tracking-tight leading-none">Gramzo</h1>
                    <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mt-0.5">Super App</p>
                </div>
            </div>

            <!-- Right: Auth / Profile -->
            <div id="auth-container">
                <!-- Unauthenticated State (User Login) -->
                <button type="button" id="btn-login-trigger" onclick="openAuthModal('User')" class="bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-md hover:bg-gray-800 transition-colors active:scale-95 flex items-center gap-2">
                    <i class="fa-solid fa-user"></i> User Login
                </button>
                
                <!-- Authenticated State -->
                <div id="profile-trigger" class="hidden flex items-center gap-3 bg-white border border-gray-100 py-1.5 pl-1.5 pr-4 rounded-full shadow-sm cursor-pointer" onclick="toggleProfileMenu()">
                    <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm">
                        <span id="nav-initial">U</span>
                    </div>
                    <div class="hidden sm:block text-left">
                        <p id="nav-name" class="text-xs font-bold text-gray-900 leading-none">User</p>
                        <span id="nav-role" class="text-[9px] font-bold text-gray-500 uppercase">Role</span>
                    </div>
                    <i class="fa-solid fa-chevron-down text-[10px] text-gray-400 ml-1"></i>
                </div>

                <!-- Profile Dropdown -->
                <div id="profile-menu" class="hidden absolute right-5 top-16 w-48 bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden transform origin-top-right transition-all">
                    <div class="p-4 border-b border-gray-50 bg-gray-50/50">
                        <p id="menu-name" class="font-bold text-sm text-gray-900">Name</p>
                        <p id="menu-phone" class="text-xs text-gray-500 font-medium">Phone</p>
                    </div>
                    <div class="p-2">
                        <button type="button" onclick="logout()" class="w-full text-left px-4 py-2.5 text-sm font-bold text-red-600 hover:bg-red-50 rounded-xl transition-colors flex items-center gap-2">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="pt-24 px-4 pb-10 max-w-md mx-auto sm:max-w-4xl sm:px-6">
        
        <!-- ========================================== -->
        <!-- VIEW: USER (Marketplace & Services)        -->
        <!-- ========================================== -->
        <div id="view-User" class="view-section active space-y-8">
            
            <!-- Address Bar -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-500 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div class="flex-1">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Delivering to</p>
                    <p class="text-sm font-bold text-gray-900 truncate" id="user-location-display">Select Location below to order</p>
                </div>
            </div>

            <!-- Services Grid -->
            <div>
                <h2 class="text-lg font-black mb-4">Explore Services</h2>
                <div class="flex overflow-x-auto no-scrollbar gap-3 sm:gap-6 pb-2">
                    <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group" onclick="filterCategory('Food')">
                        <div class="w-[70px] h-[70px] sm:w-24 sm:h-24 rounded-2xl super-icon-wrapper flex items-center justify-center text-orange-500 text-2xl group-hover:scale-105">
                            <i class="fa-solid fa-burger"></i>
                        </div>
                        <span class="text-[11px] font-bold text-gray-700">Food</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group" onclick="filterCategory('Grocery')">
                        <div class="w-[70px] h-[70px] sm:w-24 sm:h-24 rounded-2xl super-icon-wrapper flex items-center justify-center text-emerald-500 text-2xl group-hover:scale-105">
                            <i class="fa-solid fa-basket-shopping"></i>
                        </div>
                        <span class="text-[11px] font-bold text-gray-700">Grocery</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group" onclick="filterCategory('Ride')">
                        <div class="w-[70px] h-[70px] sm:w-24 sm:h-24 rounded-2xl super-icon-wrapper flex items-center justify-center text-blue-500 text-2xl group-hover:scale-105">
                            <i class="fa-solid fa-motorcycle"></i>
                        </div>
                        <span class="text-[11px] font-bold text-gray-700">Ride</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group" onclick="filterCategory('Pharmacy')">
                        <div class="w-[70px] h-[70px] sm:w-24 sm:h-24 rounded-2xl super-icon-wrapper flex items-center justify-center text-red-500 text-2xl group-hover:scale-105">
                            <i class="fa-solid fa-pills"></i>
                        </div>
                        <span class="text-[11px] font-bold text-gray-700">Meds</span>
                    </div>
                    <div class="flex flex-col items-center gap-2 shrink-0 cursor-pointer group" onclick="filterCategory('Services')">
                        <div class="w-[70px] h-[70px] sm:w-24 sm:h-24 rounded
